<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="1200" height="380" rx="18" fill="#0b111b"/>
  <text x="40" y="52" fill="#e8eef7" font-size="26" font-weight="700">Measured on the board</text>
  <text x="40" y="80" fill="#8e9bb0" font-size="15">Dragonwing IQ-9075, Hexagon v73, two NSPs. Single requests taken from the runtime's own log, not benchmark medians.</text>

  <g>
    <rect x="40" y="112" width="262" height="190" rx="14" fill="#12302e" stroke="#2bb8a6"/>
    <text x="62" y="146" fill="#4fd1c0" font-size="12" font-weight="700" letter-spacing="1.5">FIRST TOKEN</text>
    <text x="62" y="214" fill="#e8eef7" font-size="44" font-weight="700">~0.1 s</text>
    <text x="62" y="250" fill="#b6c2d4" font-size="14">66 to 230 ms across text,</text>
    <text x="62" y="270" fill="#b6c2d4" font-size="14">speech and image requests</text>
  </g>
  <g>
    <rect x="326" y="112" width="262" height="190" rx="14" fill="#12302e" stroke="#2bb8a6"/>
    <text x="348" y="146" fill="#4fd1c0" font-size="12" font-weight="700" letter-spacing="1.5">DECODE SPEED</text>
    <text x="348" y="214" fill="#e8eef7" font-size="44" font-weight="700">~40 tok/s</text>
    <text x="348" y="250" fill="#b6c2d4" font-size="14">33 to 41 tokens per second</text>
    <text x="348" y="270" fill="#b6c2d4" font-size="14">on all three models</text>
  </g>
  <g>
    <rect x="612" y="112" width="262" height="190" rx="14" fill="#12302e" stroke="#2bb8a6"/>
    <text x="634" y="146" fill="#4fd1c0" font-size="12" font-weight="700" letter-spacing="1.5">FIRST SPOKEN AUDIO</text>
    <text x="634" y="214" fill="#e8eef7" font-size="44" font-weight="700">~106 ms</text>
    <text x="634" y="250" fill="#b6c2d4" font-size="14">LFM3-Audio-2B; 20 s of speech</text>
    <text x="634" y="270" fill="#b6c2d4" font-size="14">generated in 12 s</text>
  </g>
  <g>
    <rect x="898" y="112" width="262" height="190" rx="14" fill="#172235" stroke="#2c3a52"/>
    <text x="920" y="146" fill="#8e9bb0" font-size="12" font-weight="700" letter-spacing="1.5">WHOLE REQUEST</text>
    <text x="920" y="214" fill="#e8eef7" font-size="44" font-weight="700">4–6 s</text>
    <text x="920" y="250" fill="#b6c2d4" font-size="14">Includes about 4 s of model load,</text>
    <text x="920" y="270" fill="#b6c2d4" font-size="14">paid again on every request</text>
  </g>
  <text x="40" y="344" fill="#8e9bb0" font-size="14">Not measured: peak memory, endurance, time with the model kept loaded, and accuracy of any kind.</text>
</svg>
